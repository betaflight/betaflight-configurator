name: Nightly downloads

# Builds Tauri desktop bundles + a Capacitor Android APK + a signed Tauri Android
# APK every day, uploads them to the Cloudflare R2 bucket behind
# binaries.betaflight.com, regenerates the static downloads index, and deploys it
# to the betaflight-downloads Cloudflare Pages project (downloads.betaflight.com).
#
# iOS ships via TestFlight (tauri-ios-release.yml), not the downloads page, so the
# nightly runs the full unsigned iOS compile check from tauri-pr-build.yml instead
# of building an IPA — it protects master without needing signing secrets.
#
# The Tauri Android job reuses the existing RELEASE_KEYSTORE secrets (no new ones).
#
# Required repository configuration:
#   Variables:
#     CLOUDFLARE_R2_BUCKET                 — R2 bucket name (e.g. betaflight-downloads)
#     CLOUDFLARE_R2_ENDPOINT               — https://<accountid>.r2.cloudflarestorage.com
#     CLOUDFLARE_R2_PUBLIC_BASE_URL        — https://binaries.betaflight.com
#     CLOUDFLARE_DOWNLOADS_PROJECT_NAME    — Cloudflare Pages project (e.g. betaflight-downloads)
#     WEB_APP_MASTER_URL (optional)        — Master web-app URL (defaults to main project preview)
#     WEB_APP_RELEASE_URL (optional)       — Release web-app URL (defaults to https://app.betaflight.com)
#   Secrets:
#     CLOUDFLARE_R2_ACCESS_KEY_ID
#     CLOUDFLARE_R2_SECRET_ACCESS_KEY
#     CLOUDFLARE_API_TOKEN                 — already provisioned for the existing PWA deploy
#     CLOUDFLARE_ACCOUNT_ID                — already provisioned
#     RELEASE_KEYSTORE / *_PASSWORD / *_ALIAS / *_ALIAS_PASSWORD — already provisioned for APK signing
#     MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD — Developer ID Application .p12 and its password
#     APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8 — shared with the iOS release, used to notarise
#
# The macOS DMGs are signed and notarised so nightly testers don't hit Gatekeeper.
# That also needs the MACOS_SIGNING_IDENTITY and APPLE_DEVELOPMENT_TEAM variables;
# without them the macOS jobs still build, just unsigned.
#
# R2 lifecycle: configure a 30-day expiry rule on prefix "nightly/" against the bucket
# (one-time, in the Cloudflare dashboard or via the R2 API).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-downloads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare nightly metadata
    runs-on: ubuntu-latest
    outputs:
      nightly_date: ${{ steps.meta.outputs.nightly_date }}
      nightly_prefix: ${{ steps.meta.outputs.nightly_prefix }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute metadata
        id: meta
        run: |
          NIGHTLY_DATE=$(date -u +%Y-%m-%d)
          COMMIT_SHA=$(git rev-parse HEAD)
          VERSION=$(jq -r '.version' package.json)
          {
            echo "nightly_date=${NIGHTLY_DATE}"
            echo "nightly_prefix=nightly/${NIGHTLY_DATE}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Tauri desktop (${{ matrix.label }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            target: ''
          - os: macos-latest
            label: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            label: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows
            target: ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Tauri Linux prereqs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            rpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - name: Install dependencies
        run: npm ci

      # Sign and notarise the macOS bundles with the Developer ID Application
      # certificate, so the DMGs open without a Gatekeeper warning. Tauri reads
      # the APPLE_* names from the environment. A run without the certificate
      # (a fork, or before the secrets are provisioned) builds unsigned.
      - name: Stage macOS signing credentials
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          MACOS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          MACOS_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::notice::No macOS signing certificate available; building unsigned."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A certificate without the notarisation credentials would produce a
          # signed but unnotarised bundle that still trips Gatekeeper, so fail
          # rather than ship one.
          : "${MACOS_CERTIFICATE_PASSWORD:?Set the MACOS_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_SIGNING_IDENTITY:?Set the MACOS_SIGNING_IDENTITY variable}"
          : "${MACOS_TEAM_ID:?Set the APPLE_DEVELOPMENT_TEAM variable}"
          : "${MACOS_API_ISSUER:?Set the APPLE_API_ISSUER secret}"
          : "${MACOS_API_KEY_ID:?Set the APPLE_API_KEY secret (key id)}"
          : "${MACOS_API_KEY_P8:?Set the APPLE_API_KEY_P8 secret (.p8 contents)}"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${MACOS_API_KEY_ID}.p8"
          printf '%s' "$MACOS_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # base64 wraps at 76 columns; Tauri's decoder rejects newlines. The
          # stripped value no longer matches the registered secret, so mask it
          # explicitly or it would be logged in the clear from here on.
          CERT=$(printf '%s' "$MACOS_CERTIFICATE" | tr -d '[:space:]')
          echo "::add-mask::$CERT"

          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD<<__BF_EOF__"
            printf '%s\n' "$MACOS_CERTIFICATE_PASSWORD"
            echo "__BF_EOF__"
            echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$MACOS_TEAM_ID"
            echo "APPLE_API_ISSUER=$MACOS_API_ISSUER"
            echo "APPLE_API_KEY=$MACOS_API_KEY_ID"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundle
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri:build -- --target ${{ matrix.target }}
          else
            npm run tauri:build
          fi

      - name: Stage desktop bundles
        shell: bash
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          mkdir -p staging
          shopt -s nullglob
          for path in \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb \
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm \
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg \
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          do
            cp "$path" staging/
          done
          if ! compgen -G 'staging/*' > /dev/null; then
            echo "No desktop bundles produced for ${{ matrix.label }}" >&2
            exit 1
          fi
          STRIPPED="${PKG_VERSION%%-*}"
          SHA_SHORT="${COMMIT_SHA:0:8}"
          NIGHTLY_VERSION="${PKG_VERSION}-${SHA_SHORT}"
          node scripts/rename-tauri-bundles.mjs \
            --dir staging \
            --from-version "${STRIPPED}" \
            --to-version "${NIGHTLY_VERSION}"
          ls -la staging

      # Tauri notarises and staples the .app but only signs the .dmg it wraps it
      # in. Gatekeeper assesses the downloaded .dmg, so the container needs its
      # own ticket for the download to open cleanly, including offline.
      - name: Notarise macOS disk images
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(staging/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG to notarise" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature -v "$dmg"
          done

      - name: Sync desktop bundles to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/desktop
        run: |
          aws s3 sync staging/ "s3://${R2_BUCKET}/${PREFIX}/" --endpoint-url "${R2_ENDPOINT}" --no-progress

      - name: Emit per-platform manifest fragment
        shell: bash
        env:
          PUBLIC_BASE: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/desktop
          PLATFORM: ${{ matrix.label }}
        run: |
          mkdir -p manifest-fragments
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const base = process.env.PUBLIC_BASE.replace(/\/$/, '');
          const prefix = process.env.PREFIX;
          const platform = process.env.PLATFORM;
          const files = fs.readdirSync('staging');
          const entries = files.map((file) => {
              const stat = fs.statSync(path.join('staging', file));
              let group;
              let label;
              if (file.endsWith('.exe')) {
                  group = 'windows';
                  label = 'Windows installer (x64)';
              } else if (file.endsWith('.dmg')) {
                  group = 'macos';
                  label = platform === 'macos-arm64' ? 'macOS (Apple Silicon)' : 'macOS (Intel)';
              } else if (file.endsWith('.deb')) {
                  group = 'linux';
                  label = 'Linux (.deb)';
              } else if (file.endsWith('.rpm')) {
                  group = 'linux';
                  label = 'Linux (.rpm)';
              } else if (file.endsWith('.AppImage')) {
                  group = 'linux';
                  label = 'Linux (AppImage)';
              } else {
                  return null;
              }
              return {
                  group,
                  entry: {
                      label,
                      url: `${base}/${prefix}/${encodeURIComponent(file)}`,
                      size: stat.size,
                  },
              };
          }).filter(Boolean);
          fs.writeFileSync(`manifest-fragments/${platform}.json`, JSON.stringify(entries));
          NODE

      - name: Upload manifest fragment
        uses: actions/upload-artifact@v6
        with:
          name: manifest-${{ matrix.label }}
          path: manifest-fragments/${{ matrix.label }}.json

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run build
      - run: node capacitor.config.generator.mjs
      - run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_ALIAS_PASSWORD: ${{ secrets.RELEASE_KEY_ALIAS_PASSWORD }}
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Set the RELEASE_KEYSTORE secret with your base64-encoded keystore}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Set the RELEASE_KEYSTORE_PASSWORD secret with your keystore password}"
          : "${RELEASE_KEY_ALIAS:?Set the RELEASE_KEY_ALIAS secret with your key alias}"
          : "${RELEASE_KEY_ALIAS_PASSWORD:?Set the RELEASE_KEY_ALIAS_PASSWORD secret with your key alias password}"

          mkdir -p android/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks

          pushd android >/dev/null
          ./gradlew clean
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/keystore/release.jks" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_ALIAS_PASSWORD"
          popd >/dev/null

      - name: Stage APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          mkdir -p staging
          SHA_SHORT=$(echo "$COMMIT_SHA" | head -c 8)
          APK_NAME="betaflight-${VERSION}-${SHA_SHORT}-capacitor.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "staging/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Sync APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/android
        run: |
          aws s3 sync staging/ "s3://${R2_BUCKET}/${PREFIX}/" --endpoint-url "${R2_ENDPOINT}" --no-progress

      - name: Emit Android manifest fragment
        env:
          PUBLIC_BASE: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/android
        run: |
          mkdir -p manifest-fragments
          BASE="${PUBLIC_BASE%/}"
          SIZE=$(stat -c %s "staging/${APK_NAME}")
          jq -n --arg label "Android (Capacitor)" --arg url "${BASE}/${PREFIX}/${APK_NAME}" --argjson size "$SIZE" \
            '{label: $label, url: $url, size: $size}' > manifest-fragments/android.json

      - name: Upload manifest fragment
        uses: actions/upload-artifact@v6
        with:
          name: manifest-android
          path: manifest-fragments/android.json

  tauri_android:
    name: Tauri Android APK
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          key: tauri-android

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Sign the nightly APK with the same RELEASE_KEYSTORE the Capacitor nightly uses,
      # via the keystore.properties the Tauri Gradle project reads.
      - name: Configure signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_ALIAS_PASSWORD: ${{ secrets.RELEASE_KEY_ALIAS_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Set the RELEASE_KEYSTORE secret (base64 keystore)}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Set the RELEASE_KEYSTORE_PASSWORD secret}"
          : "${RELEASE_KEY_ALIAS:?Set the RELEASE_KEY_ALIAS secret}"
          : "${RELEASE_KEY_ALIAS_PASSWORD:?Set the RELEASE_KEY_ALIAS_PASSWORD secret}"
          KS="$RUNNER_TEMP/betaflight-release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KS"
          {
            printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$RELEASE_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_ALIAS_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        run: npx --no tauri android build --apk

      - name: Stage APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          mkdir -p staging
          SHA_SHORT=$(echo "$COMMIT_SHA" | head -c 8)
          APK_NAME="betaflight-${VERSION}-${SHA_SHORT}-tauri.apk"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | grep -iv unsigned | grep -i universal | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' | grep -iv unsigned | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No signed release APK produced" >&2
            exit 1
          fi
          cp "$APK" "staging/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Sync APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/tauri-android
        run: |
          aws s3 sync staging/ "s3://${R2_BUCKET}/${PREFIX}/" --endpoint-url "${R2_ENDPOINT}" --no-progress

      - name: Emit manifest fragment
        env:
          PUBLIC_BASE: ${{ vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          PREFIX: ${{ needs.prepare.outputs.nightly_prefix }}/tauri-android
        run: |
          mkdir -p manifest-fragments
          BASE="${PUBLIC_BASE%/}"
          SIZE=$(stat -c %s "staging/${APK_NAME}")
          jq -n --arg label "Android (Tauri)" --arg url "${BASE}/${PREFIX}/${APK_NAME}" --argjson size "$SIZE" \
            '{label: $label, url: $url, size: $size}' > manifest-fragments/tauri-android.json

      - name: Upload manifest fragment
        uses: actions/upload-artifact@v6
        with:
          name: manifest-tauri-android
          path: manifest-fragments/tauri-android.json

  # Full unsigned iOS build — same check PRs run, so master stays iOS-buildable
  # without any Apple signing secrets or a downloadable IPA.
  tauri_ios_check:
    name: Tauri iOS compile check
    uses: ./.github/workflows/tauri-pr-build.yml
    permissions:
      contents: read
    with:
      ios-only: true

  publish:
    name: Publish downloads index
    # Run once the established desktop + Capacitor Android builds succeed; the
    # Tauri Android job is best-effort (its fragment is included if present) so a
    # signing hiccup can't block the whole downloads index.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.desktop.result == 'success' &&
      needs.android.result == 'success' &&
      github.ref == 'refs/heads/master'
    needs: [prepare, desktop, android, tauri_android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: nightly-downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Download manifest fragments
        uses: actions/download-artifact@v7
        with:
          path: manifest-fragments
          pattern: manifest-*
          merge-multiple: true

      - name: Build manifest
        env:
          NIGHTLY_DATE: ${{ needs.prepare.outputs.nightly_date }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const fragmentsDir = 'manifest-fragments';
          const desktop = { windows: [], macos: [], linux: [] };
          let android = null;
          let tauriAndroid = null;
          for (const file of fs.readdirSync(fragmentsDir)) {
              const data = JSON.parse(fs.readFileSync(path.join(fragmentsDir, file), 'utf8'));
              if (file === 'android.json') {
                  android = data;
                  continue;
              }
              if (file === 'tauri-android.json') {
                  tauriAndroid = data;
                  continue;
              }
              for (const item of data) {
                  desktop[item.group]?.push(item.entry);
              }
          }
          const manifest = {
              generatedAt: new Date().toISOString(),
              nightly: {
                  date: process.env.NIGHTLY_DATE,
                  commit: process.env.COMMIT_SHA,
                  version: process.env.VERSION,
                  desktop,
                  android,
                  tauriAndroid,
              },
          };
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2));
          NODE
          cat manifest.json

      - name: Fetch GitHub releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" | jq 'add' > releases.json
          jq -e 'type == "array" and (length == 0 or all(.[]; has("tag_name") and has("html_url")))' releases.json > /dev/null

      - name: Generate index
        env:
          MASTER_URL: ${{ vars.WEB_APP_MASTER_URL }}
          RELEASE_URL: ${{ vars.WEB_APP_RELEASE_URL }}
        run: |
          ARGS=(--manifest manifest.json --releases releases.json --output dist-downloads)
          if [ -n "${MASTER_URL}" ]; then
            ARGS+=(--master-url "${MASTER_URL}")
          fi
          if [ -n "${RELEASE_URL}" ]; then
            ARGS+=(--release-url "${RELEASE_URL}")
          fi
          node scripts/generate-downloads-index.mjs "${ARGS[@]}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-downloads --project-name=${{ vars.CLOUDFLARE_DOWNLOADS_PROJECT_NAME }} --branch=master --commit-dirty=true
