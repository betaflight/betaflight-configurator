name: Debug modes drift

# The firmware is the single source of truth for debug modes: `debug_mode_e` in
# `src/main/build/debug.h` fixes the numeric debug_mode every blackbox log and
# every MSP reply carries. This job re-runs `scripts/generate-debug-modes.mjs`
# against firmware master and opens a PR when the generated tables have moved.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: update_debug_modes_from_firmware

jobs:
  debug-modes-drift:
    name: Regenerate the debug mode tables from firmware master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout configurator
        uses: actions/checkout@v5

      - name: Checkout firmware
        uses: actions/checkout@v5
        with:
          repository: betaflight/betaflight
          path: firmware
          # The generator picks the newest commit carrying each MSP API version, so
          # it needs the history of msp_protocol.h - but none of the file contents
          # it does not ask for.
          fetch-depth: 0
          filter: blob:none

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Check the committed tables against firmware master
        id: check
        continue-on-error: true
        run: node scripts/generate-debug-modes.mjs --repo "${{ github.workspace }}/firmware" --check

      - name: Report no drift
        if: steps.check.outcome == 'success'
        run: echo "The debug mode tables match firmware master." >> "$GITHUB_STEP_SUMMARY"

      # Fails when firmware changed an index inside an API version that is already
      # committed, which would re-map the debug fields of every blackbox log
      # recorded with it. That needs a human, not an automatic PR, so the job is
      # left to fail with the generator's report.
      - name: Regenerate
        if: steps.check.outcome == 'failure'
        run: npm run generate:debug-modes -- --repo "${{ github.workspace }}/firmware"

      - name: Test against the regenerated tables
        id: tests
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        run: npm run test -- run

      - name: Open or update the pull request
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH"
          git add src/js/debug_modes_table.js test/generated/debug_field_usage.json

          if git diff --cached --quiet; then
            echo "Generator reported drift but produced no file changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore: regenerate the debug mode tables from firmware master"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the existing PR for $BRANCH." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            test_line="The test suite passes against the regenerated tables."
          else
            test_line="**The test suite fails against the regenerated tables.** Most likely \`test/js/utils/debugModesFirmware.test.js\`, which reports every debug field the firmware now writes without a label, and every label whose field the firmware stopped writing. Add the missing labels to \`getDebugFieldNames()\` in \`src/js/utils/debugModes.js\` and update \`KNOWN_LABEL_GAPS\`."
          fi

          # Built line by line: a quoted multi-line string inside this block would
          # carry the block's indentation into the PR body and render as code.
          {
            echo "**This is an automated PR.**"
            echo
            echo "\`scripts/generate-debug-modes.mjs\` found that the debug mode tables no longer match the firmware. The firmware is the single source of truth here: a name's index in \`debug_mode_e\` is the numeric debug_mode stored in every blackbox log header and reported over MSP."
            echo
            echo "$test_line"
            echo
            echo "Regenerate locally with \`npm run generate:debug-modes\` (needs a firmware checkout: \`--repo <path>\` or \`\$BETAFLIGHT_REPO\`)."
            echo
            echo "The generator only ever appends to an API version that is already committed - had firmware changed an existing index, this job would have failed instead of opening a PR."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --head "$BRANCH" \
            --title "Regenerate the debug mode tables from firmware master" \
            --body-file "$RUNNER_TEMP/pr-body.md"
