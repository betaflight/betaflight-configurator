name: Test

on:
  pull_request:
  push:
    branches:
      - master
      - '*-maintenance'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test

  lockfile:
    name: Lockfile in sync
    runs-on: ubuntu-latest
    # Reading the tree is all this job does; it never pushes.
    permissions:
      contents: read
    # Dependabot resolves lockfiles with its own npm, which may predate the
    # version pinned in .nvmrc. Its PRs are re-normalised on merge instead.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --ignore-scripts

      # A plain install keeps every version the lockfile already satisfies, so
      # this only reports a diff when the committed lockfile was not written by
      # the npm that .nvmrc pins. Never use --package-lock-only here: it cannot
      # see inside bundled dependencies and produces a different tree.
      #
      # NOSONAR below is for S8543 ("lock resolved versions"): re-resolving is
      # precisely what this job is for. The lockfile is committed and `npm ci`
      # above already installed from it; this step only proves that npm agrees
      # with what was committed. Pinning here would delete the check.
      - name: Re-resolve the lockfile
        run: npm install --ignore-scripts --no-audit --no-fund # NOSONAR

      - name: Fail if the lockfile drifted
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is not in sync with package.json."
            echo "Run 'nvm use && npm install' and commit the result."
            echo "npm in use: $(npm --version) (engines requires >=11.6.1)"
            git --no-pager diff --stat -- package-lock.json
            exit 1
          fi
          echo "package-lock.json is in sync."
