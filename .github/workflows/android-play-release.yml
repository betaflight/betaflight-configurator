name: Android Play release

# Builds the signed Capacitor Android App Bundle and uploads it to Google Play.
#
# versionCode = <version floor, e.g. 2026006000> + github.run_number, so every
# run outranks the previous upload. versionName = <version>.<run_number>.
#
# Required repository secrets (distinct from the sideload RELEASE_* secrets):
#   ANDROID_UPLOAD_KEYSTORE           base64 of the upload keystore (betaflight-upload.jks)
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_UPLOAD_KEY_ALIAS          key alias (upload)
#   ANDROID_UPLOAD_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON         Google Play Developer API service-account JSON (plain text)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on the track"
        required: true
        type: choice
        default: completed
        options: [completed, draft]

jobs:
  android:
    name: Build & publish Android bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build

      - name: Generate Capacitor config
        run: node capacitor.config.generator.mjs

      - name: Sync Capacitor Android project
        run: npx --no cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build signed AAB
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          : "${ANDROID_UPLOAD_KEYSTORE:?Set the ANDROID_UPLOAD_KEYSTORE secret (base64 keystore)}"
          : "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:?Set the ANDROID_UPLOAD_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?Set the ANDROID_UPLOAD_KEY_ALIAS secret}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?Set the ANDROID_UPLOAD_KEY_PASSWORD secret}"
          KS="$RUNNER_TEMP/betaflight-upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$KS"
          pushd android >/dev/null
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"
          popd >/dev/null

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: betaflight-app-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.betaflight.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: distribution/play/whatsnew
