# ID used by the upload action to Crowdin
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

#
# Files configuration
#
"preserve_hierarchy": true

files: [
 {
  #
  # Source files filter
  # e.g. "/resources/en/*.json"
  #
  "source" : "/locales/en/messages.json",

  #
  # where translations live
  # e.g. "/resources/%two_letters_code%/%original_file_name%"
  #
  "translation" : "/locales/%two_letters_code%/%original_file_name%",

  #
  # %two_letters_code% is ISO 639-1, so it cannot tell dialects apart: Crowdin's "pt-BR" and
  # "pt-PT" both resolve to "pt", and its "zh-CN" and "zh-TW" both to "zh". These three are
  # therefore mapped onto the folder we ship, or Brazilian Portuguese would overwrite
  # locales/pt and the two Chinese variants would fight over a locales/zh the app never
  # loads. The keys are Crowdin language ids and the values are folder names, so now that
  # the folders follow BCP 47 this reads as an identity mapping, but it is not one.
  #
  "languages_mapping" : {
    "two_letters_code" : {
      "pt-BR" : "pt-BR",
      "zh-CN" : "zh-CN",
      "zh-TW" : "zh-TW"
    }
  }
 }
]
