# Gradle scripts are excluded because S8569 wants a committed gradle.lockfile,
# which the Capacitor Android project does not keep: it pulls `:capacitor-android`
# from `node_modules/@capacitor/android`, so it does not resolve from a clean
# checkout. Automatic Analysis ignores sonar.issue.ignore.multicriteria, leaving
# a file exclusion as the only in-repo lever. Kotlin and Java sources stay in
# scope.
#
# The debug tables are generated rather than hand-maintained: both are written by
# `scripts/generate-debug-modes.mjs` from the firmware sources. Their
# per-API-version blocks are near-identical by construction - the enum is repeated
# in full for each version so a mode's index stays literal and greppable - which
# reads as duplication.
#
# `scripts/` is build tooling rather than shipped code. It runs on a maintainer's
# machine to regenerate committed artifacts and never reaches a user, so rules
# written for browser code — and for the untrusted input a browser handles —
# report against it without anything to protect.
sonar.exclusions=**/*.gradle,**/*.gradle.kts,scripts/**,src/js/debug_modes_table.ts,src/js/debug_fields_table.ts,test/generated/**
sonar.cpd.exclusions=scripts/**,src/js/debug_modes_table.ts,src/js/debug_fields_table.ts,test/generated/**
