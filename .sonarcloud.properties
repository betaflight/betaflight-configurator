# Exclude the Tauri-generated Android project (Gradle scaffold, manifests, icons,
# buildSrc plugin) from analysis — it is generated by `tauri android init`, not
# hand-maintained, so its findings are upstream Tauri concerns, not ours.
#
# Exclude the generated debug mode tables for the same reason: both are written by
# `scripts/generate-debug-modes.mjs` from the firmware sources. Their per-API-version
# blocks are near-identical by construction - the enum is repeated in full for each
# version so a mode's index stays literal and greppable - which reads as duplication.
sonar.exclusions=src-tauri/gen/**,src/js/debug_modes_table.js,test/generated/**
sonar.cpd.exclusions=src-tauri/gen/**,src/js/debug_modes_table.js,test/generated/**
