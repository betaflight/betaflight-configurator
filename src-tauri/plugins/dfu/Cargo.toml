[package]
name = "tauri-plugin-dfu"
version = "0.1.0"
description = "USB DFU transport for the Betaflight app on Android: Kotlin owns enumeration and permissions, Rust owns transfers via nusb on a duplicated fd."
authors = ["The Betaflight open source project."]
license = "GPL-3.0"
edition = "2024"
links = "tauri-plugin-dfu"

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
nusb = "0.2"
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
